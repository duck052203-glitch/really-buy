<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>真的要買嗎？</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f7f4ef;
      color: #292522;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans TC",
        sans-serif;
    }

    .container {
      width: 100%;
      max-width: 560px;
      margin: auto;
      padding: 24px 18px 50px;
    }

    .title {
      text-align: center;
      padding: 25px 0;
    }

    .title h1 {
      margin: 0;
      font-size: 30px;
    }

    .title p {
      color: #777;
      font-size: 14px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.05);
    }

    h2 {
      margin-top: 0;
      font-size: 21px;
    }

    label {
      display: block;
      margin-top: 16px;
      margin-bottom: 7px;
      font-weight: bold;
      font-size: 14px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd6cd;
      border-radius: 10px;
      font-size: 16px;
      font-family: inherit;
      background: white;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    .photo-box {
      border: 1.5px dashed #cfc6bb;
      border-radius: 12px;
      padding: 18px;
      text-align: center;
      color: #777;
      cursor: pointer;
    }

    .photo-box input {
      display: none;
    }

    .preview {
      max-width: 100%;
      max-height: 250px;
      margin-top: 12px;
      border-radius: 10px;
      display: none;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 14px;
      margin-top: 18px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      background: #292522;
      color: white;
    }

    .green {
      background: #638a68;
    }

    .red {
      background: #a96969;
    }

    .gray {
      background: #eee9e2;
      color: #292522;
    }

    .hidden {
      display: none;
    }

   .product-image {
  width: 100%;
  height: auto;
  max-height: 500px;
  object-fit: contain;
  border-radius: 13px;
  display: block;
  margin: 0 auto;
}

    .price {
      font-size: 25px;
      font-weight: bold;
      margin: 10px 0 18px;
    }

    .reason {
      background: #f7f4ef;
      border-radius: 12px;
      padding: 14px;
      line-height: 1.7;
    }

    .vote-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .vote-buttons button {
      margin-top: 0;
    }

    .bar {
      height: 10px;
      background: #eee9e2;
      border-radius: 20px;
      overflow: hidden;
      margin-top: 10px;
    }

    .bar-fill {
      height: 100%;
      width: 0%;
      background: #638a68;
      transition: 0.3s;
    }

    .comment {
      border-top: 1px solid #eee9e2;
      padding: 13px 0;
      line-height: 1.6;
    }

    .small {
      color: #888;
      font-size: 13px;
    }

    .share-link {
      background: #f7f4ef;
      padding: 12px;
      border-radius: 10px;
      word-break: break-all;
      font-size: 13px;
    }

    .loading {
      text-align: center;
      color: #777;
      padding: 30px 0;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="title">
    <h1>真的要買嗎？</h1>
    <p>買之前，先問問大家。</p>
  </div>

  <!-- 建立申請 -->
  <section id="createPage" class="card">

    <h2>🛍️ 建立購物申請</h2>
<label>👤 誰想買？</label>

<input
  id="buyerName"
  placeholder="例如：撿破爛大師"
>
    <label>想買什麼？</label>
    <input id="itemName" placeholder="例如：電影海報">

    <label>價格</label>
    <input id="itemPrice" type="number" placeholder="例如：1200">

    <label>商品照片</label>

    <label class="photo-box">
      📷 點這裡上傳照片

      <input
        id="itemPhoto"
        type="file"
        accept="image/*"
      >

      <img
        id="photoPreview"
        class="preview"
      >
    </label>

    <label>為什麼想買？</label>

    <textarea
      id="itemReason"
      placeholder="例如：很喜歡這部電影，而且這張海報很難買到……"
    ></textarea>

    <label>冷靜期</label>

    <select id="cooldown">
  <option value="0.5">30 分鐘</option>
  <option value="2">2 小時</option>
  <option value="6">6 小時</option>
  <option value="24">24 小時</option>
  <option value="72" selected>3 天</option>
</select>

    <button onclick="createRequest()">
      建立審核連結
    </button>

  </section>


  <!-- 建立完成 -->
  <section id="createdPage" class="card hidden">

    <h2>🎉 審核建立好了</h2>

    <p>
      把這個連結丟到 LINE 群組，
      大家點開就可以投票、留言。
    </p>

    <div id="shareLink" class="share-link"></div>

    <button onclick="copyLink()">
      複製連結
    </button>

    <button class="gray" onclick="showRequest()">
      先看看審核頁
    </button>

  </section>


  <!-- 審核頁 -->
  <section id="requestPage" class="card hidden">

    <div id="requestContent">
      <div class="loading">載入中……</div>
    </div>

    <h2 style="margin-top:25px;">
      🗳️ 你的判斷
    </h2>

    <div class="vote-buttons">

      <button
        class="green"
        onclick="vote('yes')"
      >
        🟢 請買
      </button>

      <button
        class="red"
        onclick="vote('no')"
      >
        🔴 下面一位
      </button>

    </div>

    <p id="voteMessage" class="small"></p>

    <p>
      🟢 <span id="yesCount">0</span>
      　
      🔴 <span id="noCount">0</span>
    </p>

    <div class="bar">
      <div id="barFill" class="bar-fill"></div>
    </div>

   <button
  onclick="newRequest()"
  style="margin-top:20px;"
>
  ＋ 新增商品
</button>

<div id="comments"></div>

<label>留言</label>

<input
  id="nickname"
  placeholder="你的暱稱"
>

<textarea
  id="commentText"
  placeholder="例如：你不是已經有一個類似的了嗎？"
></textarea>

<button onclick="addComment()">
  送出留言
</button>

  </section>
</div>


<script>

const SUPABASE_URL =
  "https://asewibkuhhgdqayxymbm.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_GXcRf7mkxLOjsbS56YcShA_LIWYjCH9";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let data = null;
let photoData = "";

const params =
  new URLSearchParams(location.search);


/* 上傳照片 */

document
  .getElementById("itemPhoto")
  .addEventListener("change", function(event) {

    const file = event.target.files[0];

    if (!file) return;

    if (file.size > 5 * 1024 * 1024) {
      alert("照片不能超過 5MB");
      event.target.value = "";
      return;
    }

    const reader = new FileReader();

    reader.onload = function() {

      photoData = reader.result;

      const preview =
        document.getElementById("photoPreview");

      preview.src = photoData;
      preview.style.display = "block";

    };

    reader.readAsDataURL(file);

  });


/* 建立申請 */

async function createRequest() {
const buyerName =
  document
    .getElementById("buyerName")
    .value
    .trim();
  const name =
    document
      .getElementById("itemName")
      .value
      .trim();

  const price =
    Number(
      document
        .getElementById("itemPrice")
        .value
    );

  const reason =
    document
      .getElementById("itemReason")
      .value
      .trim();

  const cooldown =
    Number(
      document
        .getElementById("cooldown")
        .value
    );


  if (!name || !price || !reason) {

    alert(
      "請至少填寫商品、價格和購買理由"
    );

    return;
  }


  const id = crypto.randomUUID();
let imageUrl = null;

if (document.getElementById("itemPhoto").files[0]) {

  const file =
    document.getElementById("itemPhoto").files[0];

  const filePath =
    id + "/" + file.name;

  const { error: uploadError } =
    await supabaseClient
      .storage
      .from("product-images")
      .upload(filePath, file);

  if (uploadError) {

    console.error(uploadError);

    alert(
      "照片上傳失敗：" + uploadError.message
    );

    return;
  }

  imageUrl =
    supabaseClient
      .storage
      .from("product-images")
      .getPublicUrl(filePath)
      .data
      .publicUrl;

}

 const newRequest = {
  id: id,
  buyer_name: buyerName,
  item_name: name,
  price: price,
  image_url: imageUrl,
  reason: reason,
  cooldown_hours: cooldown
};


  const { error } =
    await supabaseClient
      .from("requests")
      .insert(newRequest);


  if (error) {

    console.error(error);

    alert(
      "建立失敗：" + error.message
    );

    return;
  }


  data = {

    id: id,

    name: name,

    price: price,

    photo: photoData,

    reason: reason,

    cooldown: cooldown,

    created: Date.now(),

    yes: 0,

    no: 0,

    comments: []

  };


  const url =
    location.origin +
    location.pathname +
    "?id=" +
    data.id;


  document
    .getElementById("shareLink")
    .textContent = url;


  document
    .getElementById("createPage")
    .classList.add("hidden");


  document
    .getElementById("createdPage")
    .classList.remove("hidden");

}


/* 顯示申請 */

async function showRequest() {

  document
    .getElementById("createdPage")
    .classList.add("hidden");

  document
    .getElementById("requestPage")
    .classList.remove("hidden");

  if (data && data.id) {
    await loadRequestById(data.id);
  }

}


/* 讀取申請 */

async function loadRequest(id = null) {

  const requestId =
    id || params.get("id");

  if (!requestId) return;

  await loadRequestById(requestId);

}


async function loadRequestById(id) {

  const { data: request, error } =
    await supabaseClient
      .from("requests")
      .select("*")
      .eq("id", id)
      .single();


  if (error || !request) {

    document
      .getElementById("requestContent")
      .innerHTML =
      "<p>找不到這個購物申請。</p>";

    return;
  }


  const { data: votes } =
    await supabaseClient
      .from("votes")
      .select("vote")
      .eq("request_id", id);


  const { data: comments } =
    await supabaseClient
      .from("comments")
      .select("*")
      .eq("request_id", id)
      .order("created_at", {
        ascending: true
      });


  data = {

    id: request.id, 
    
    buyerName: request.buyer_name,

    name: request.item_name,

    price: request.price,

    photo: request.image_url,

    reason: request.reason,

    cooldown: request.cooldown_hours,

    created:
      new Date(request.created_at).getTime(),

    yes:
      (votes || [])
        .filter(v => v.vote === "yes")
        .length,

    no:
      (votes || [])
        .filter(v => v.vote === "no")
        .length,

    comments:
      comments || []

  };


  render();

}



/* 投票 */

async function vote(type) {

  if (!data) return;

  const remaining =
    Math.max(
      0,
      data.created +
      data.cooldown * 3600000 -
      Date.now()
    );

  if (remaining <= 0) {

    document
      .getElementById("voteMessage")
      .textContent =
      "⏰ 冷靜期已結束，投票截止。";

    return;
  }


  const voteKey =
    "voted_" + data.id;


  if (
    sessionStorage.getItem(voteKey)
  ) {

    document
      .getElementById("voteMessage")
      .textContent =
      "你已經投過票了。";

    return;

  }


  const voterId =
    getVoterId();


  const { error } =
    await supabaseClient
      .from("votes")
      .insert({

        request_id: data.id,

        vote: type,

        voter_id: voterId

      });


  if (error) {

    console.error(error);

    if (
      error.code === "23505"
    ) {

      sessionStorage.setItem(
        voteKey,
        type
      );

      document
        .getElementById("voteMessage")
        .textContent =
        "你已經投過票了。";

      return;

    }


    alert(
      "投票失敗：" + error.message
    );

    return;
  }


  sessionStorage.setItem(
    voteKey,
    type
  );


  document
    .getElementById("voteMessage")
    .textContent =
    "已完成投票！";


  await loadRequest(data.id);

}


/* 留言 */

async function addComment() {

  if (!data) return;


  const name =
    document
      .getElementById("nickname")
      .value
      .trim() ||
    "匿名朋友";


  const text =
    document
      .getElementById("commentText")
      .value
      .trim();


  if (!text) {

    alert("請寫一點意見");

    return;

  }


  const { error } =
    await supabaseClient
      .from("comments")
      .insert({

        request_id: data.id,

        content:
          name + "|||" + text

      });


  if (error) {

    console.error(error);

    alert(
      "留言失敗：" + error.message
    );

    return;
  }


  document
    .getElementById("commentText")
    .value = "";


  await loadRequest(data.id);

}
/* 新增商品 */

function newRequest() {

  document
    .getElementById("requestPage")
    .classList.add("hidden");

  document
    .getElementById("createdPage")
    .classList.add("hidden");

  document
    .getElementById("createPage")
    .classList.remove("hidden");
  
document
  .getElementById("buyerName")
  .value = "";
  
  document
    .getElementById("itemName")
    .value = "";

  document
    .getElementById("itemPrice")
    .value = "";

  document
    .getElementById("itemReason")
    .value = "";

  document
    .getElementById("itemPhoto")
    .value = "";

  document
    .getElementById("photoPreview")
    .style.display = "none";

  photoData = "";

}

/* 產生匿名使用者 ID */

function getVoterId() {

  let id =
    localStorage.getItem(
      "really_buy_voter_id"
    );


  if (!id) {

    id = crypto.randomUUID();

    localStorage.setItem(
      "really_buy_voter_id",
      id
    );

  }


  return id;

}


/* 顯示內容 */

function render() {

  if (!data) return;

  const remaining =
    Math.max(
      0,
      data.created +
      data.cooldown * 3600000 -
      Date.now()
    );

  const hours =
    Math.floor(
      remaining / 3600000
    );

  const minutes =
    Math.floor(
      (remaining % 3600000) / 60000
    );

  const seconds =
    Math.floor(
      (remaining % 60000) / 1000
    );

  document
    .getElementById("requestContent")
    .innerHTML = `

      ${
        data.photo
        ?
        `<img
          class="product-image"
          src="${data.photo}"
        >`
        :
        ""
      }

     <div class="small">
  👤 ${escapeHTML(data.buyerName)} 想買
</div>

<h2 style="margin-top:8px;">
  ${escapeHTML(data.name)}
</h2>

      <div class="price">
        NT$ ${Number(data.price).toLocaleString()}
      </div>

      <div class="reason">

        <b>💭 為什麼想買？</b>

        <br>

        ${escapeHTML(data.reason)
          .replace(/\n/g, "<br>")}

      </div>

      <p class="small">

        ⏰ 冷靜期：

        ${
          remaining
          ?
          `還剩 ${hours} 小時 ${minutes} 分鐘 ${seconds} 秒`
          :
          "已結束"
        }

      </p>

    `;


  document
    .getElementById("yesCount")
    .textContent = data.yes;

  document
    .getElementById("noCount")
    .textContent = data.no;


  const total =
    data.yes + data.no;

  const percent =
    total
    ?
    data.yes / total * 100
    :
    0;

  document
    .getElementById("barFill")
    .style.width =
    percent + "%";

document
  .getElementById("comments")
  .innerHTML =
  data.comments
    .map(comment => {

      const parts =
        String(comment.content)
          .split("|||");

      const name =
        parts[0] || "匿名朋友";

      const text =
        parts.slice(1).join("|||");

      const time =
        new Date(comment.created_at)
          .toLocaleString("zh-TW", {
            year: "numeric",
            month: "2-digit",
            day: "2-digit",
            hour: "2-digit",
            minute: "2-digit"
          });

      return `

        <div class="comment">

          <b>
            ${escapeHTML(name)}
          </b>

          <span
            style="
              font-size:12px;
              color:#999;
              margin-left:8px;
            "
          >
            ${time}
          </span>

          <br>

          ${escapeHTML(text)}

        </div>

      `;

    })
    .join("");


  const voteButtons =
    document.querySelectorAll(
      ".vote-buttons button"
    );

  voteButtons.forEach(button => {

    button.disabled =
      remaining <= 0;

  });


  if (remaining <= 0) {

    document
      .getElementById("voteMessage")
      .textContent =
      "⏰ 冷靜期已結束，投票截止。";

  }

}


/* 每秒更新一次冷靜期 */

setInterval(() => {

  if (data) {
    render();
  }

}, 1000);



/* 複製連結 */

function copyLink() {

  const link =
    document
      .getElementById("shareLink")
      .textContent;


  navigator.clipboard
    .writeText(link)
    .then(() => {

      alert("連結已複製！");

    });

}


/* 防止文字被當成 HTML */

function escapeHTML(text) {

  return String(text)
    .replace(/[&<>"']/g, function(char) {

      return {

        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"

      }[char];

    });

}


/* 如果網址有申請 ID */

if (params.get("id")) {

  document
    .getElementById("createPage")
    .classList.add("hidden");

  document
    .getElementById("requestPage")
    .classList.remove("hidden");

  loadRequest();

}

</script>

</body>
</html>
